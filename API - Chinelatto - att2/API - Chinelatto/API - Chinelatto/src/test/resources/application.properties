# Configuracao usada SO nos testes (sobrepoe a de producao).
# Usa H2 em memoria para nao depender do MySQL remoto da escola na CI.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Nos testes o Hibernate cria/destroi o schema; o Liquibase fica desligado
# (o changelog de indices assume tabelas pre-existentes do MySQL).
spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=false
spring.jpa.show-sql=false
