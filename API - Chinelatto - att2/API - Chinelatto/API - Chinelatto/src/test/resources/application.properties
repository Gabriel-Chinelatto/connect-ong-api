# Configuracao usada SO nos testes (sobrepoe a de producao).
# Usa H2 em memoria para nao depender do MySQL remoto da escola na CI.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Nos testes o Hibernate cria/destroi o schema; o Liquibase fica desligado
# (o changelog de indices assume tabelas pre-existentes do MySQL).
spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=false
spring.jpa.show-sql=false

# "Modo Feira" LIGADO no contexto de teste: a suite exercita a simulacao da
# feira (codigoDemo no esqueci-senha e no 2FA — SenhaResetTest,
# SegundaRodadaFeedbackTest). Em producao o default do codigo e FALSE (seguro);
# aqui optamos por true explicitamente. O DemoToggleTest sobrepoe para false no
# seu proprio contexto para provar o desligamento.
app.demo.enabled=true

# Segredo do JWT usado so nos testes (>= 256 bits para HS256). Como o JwtService
# nao tem mais valor default, os testes de contexto Spring precisam desta chave.
app.jwt.secret=segredo-de-teste-com-pelo-menos-256-bits-para-hs256-ok!!

# Conta ADMIN de teste: o AdminBootstrap a cria no startup do contexto (H2),
# permitindo validar o login de admin e o acesso aos endpoints ROLE_ADMIN.
app.admin.email=admin@teste.local
app.admin.password=admin-teste-123456

# Rate limiting: os testes MockMvc compartilham o mesmo IP (127.0.0.1), entao
# os limites reais (5/15min) travariam a suite inteira apos poucas chamadas.
# Aqui os limites ficam altissimos (efetivamente desligados) e o RateLimitTest
# restaura os valores reais com @TestPropertySource para provar o comportamento.
app.ratelimit.max-falhas=100000
app.ratelimit.max-solicitacoes=100000
# Tetos de contribuicao/doacao simulada tambem desligados (mesmo motivo: o
# estado do rate limiting e in-memory e compartilhado por 127.0.0.1 na suite).
app.ratelimit.max-contribuicoes=100000
app.ratelimit.max-doacoes=100000

# Assistente de IA: sem chave (fallback por regras e o que a CI testa). O teto de
# mensagens fica altissimo (desligado) porque os testes compartilham o IP
# 127.0.0.1; o AssistenteRateLimitTest restaura um valor real via @TestPropertySource.
app.ia.groq.key=
app.ia.ratelimit.max=100000
# Novas features de IA/estimativa: limites desligados na suite (mesmo motivo do IP
# 127.0.0.1 compartilhado). Cada endpoint tem seu proprio escopo de rate limit.
app.ia.sugestoes.ratelimit.max=100000
app.ia.redacao.ratelimit.max=100000
app.ia.resumo.ratelimit.max=100000
app.ia.sobre.ratelimit.max=100000
app.frete.ratelimit.max=100000
