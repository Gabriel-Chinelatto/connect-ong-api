# Configuracao usada SO nos testes (sobrepoe a de producao).
# Usa H2 em memoria para nao depender do MySQL remoto da escola na CI.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Nos testes o Hibernate cria/destroi o schema; o Liquibase fica desligado
# (o changelog de indices assume tabelas pre-existentes do MySQL).
spring.jpa.hibernate.ddl-auto=create-drop
spring.liquibase.enabled=false
spring.jpa.show-sql=false

# Segredo do JWT usado so nos testes (>= 256 bits para HS256). Como o JwtService
# nao tem mais valor default, os testes de contexto Spring precisam desta chave.
app.jwt.secret=segredo-de-teste-com-pelo-menos-256-bits-para-hs256-ok!!

# Conta ADMIN de teste: o AdminBootstrap a cria no startup do contexto (H2),
# permitindo validar o login de admin e o acesso aos endpoints ROLE_ADMIN.
app.admin.email=admin@teste.local
app.admin.password=admin-teste-123456
