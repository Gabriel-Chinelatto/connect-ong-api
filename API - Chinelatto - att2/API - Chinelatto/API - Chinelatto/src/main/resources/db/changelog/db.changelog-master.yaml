databaseChangeLog:

  # =====================================================================
  # Bloco 17 - Indices de performance.
  #
  # Observacao sobre baseline: as tabelas da aplicacao ja existiam antes do
  # Liquibase (criadas pelo antigo ddl-auto=update). Por isso elas NAO entram
  # neste changelog - o Liquibase so gerencia o que esta descrito aqui, e as
  # tabelas existentes ficam intactas. As mudancas versionadas comecam nos
  # indices abaixo. Um baseline completo da schema pode ser gerado depois com
  # 'liquibase generateChangeLog', se necessario.
  #
  # Cada changeset tem preCondition 'not indexExists' (onFail/onError MARK_RAN)
  # para ser idempotente e seguro no MySQL 5.6 (que nao tem CREATE INDEX IF NOT
  # EXISTS). Indices de FK ja criados pelo Hibernate e o unique de usuario.email
  # foram deixados de fora de proposito.
  # =====================================================================

  - changeSet:
      id: bloco17-idx-necessidade-status
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                tableName: necessidade
                indexName: idx_necessidade_status
      changes:
        - createIndex:
            tableName: necessidade
            indexName: idx_necessidade_status
            columns:
              - column:
                  name: status

  - changeSet:
      id: bloco17-idx-notificacao-usuario
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                tableName: notificacao
                indexName: idx_notificacao_usuario
      changes:
        - createIndex:
            tableName: notificacao
            indexName: idx_notificacao_usuario
            columns:
              - column:
                  name: usuario_id

  - changeSet:
      id: bloco17-idx-doacao-fin-doador
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                tableName: doacao_financeira
                indexName: idx_doacao_fin_doador
      changes:
        - createIndex:
            tableName: doacao_financeira
            indexName: idx_doacao_fin_doador
            columns:
              - column:
                  name: doador_id

  - changeSet:
      id: bloco17-idx-doacao-fin-ong
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                tableName: doacao_financeira
                indexName: idx_doacao_fin_ong
      changes:
        - createIndex:
            tableName: doacao_financeira
            indexName: idx_doacao_fin_ong
            columns:
              - column:
                  name: ong_id

  - changeSet:
      id: bloco17-idx-avaliacao-ong
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                tableName: avaliacao
                indexName: idx_avaliacao_ong
      changes:
        - createIndex:
            tableName: avaliacao
            indexName: idx_avaliacao_ong
            columns:
              - column:
                  name: ong_id

  - changeSet:
      id: bloco17-idx-avaliacao-doador
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                tableName: avaliacao
                indexName: idx_avaliacao_doador
      changes:
        - createIndex:
            tableName: avaliacao
            indexName: idx_avaliacao_doador
            columns:
              - column:
                  name: doador_id

  - changeSet:
      id: bloco17-idx-audit-usuario
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                tableName: audit_log
                indexName: idx_audit_usuario
      changes:
        - createIndex:
            tableName: audit_log
            indexName: idx_audit_usuario
            columns:
              - column:
                  name: usuario_id

  - changeSet:
      id: bloco17-idx-audit-acao
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                tableName: audit_log
                indexName: idx_audit_acao
      changes:
        - createIndex:
            tableName: audit_log
            indexName: idx_audit_acao
            columns:
              - column:
                  name: acao

  - changeSet:
      id: bloco17-idx-usuario-ong
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                tableName: usuario
                indexName: idx_usuario_ong
      changes:
        - createIndex:
            tableName: usuario
            indexName: idx_usuario_ong
            columns:
              - column:
                  name: ong_id

  # =====================================================================
  # Bloco 22 - Campanhas: reaproveita a tabela `projeto` (renomeada para
  # `campanha`) e adiciona as colunas de meta/progresso/datas.
  # =====================================================================

  - changeSet:
      id: bloco22-rename-projeto-para-campanha
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: projeto
        - not:
            - tableExists:
                tableName: campanha
      changes:
        - renameTable:
            oldTableName: projeto
            newTableName: campanha

  - changeSet:
      id: bloco22-campanha-add-colunas
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - tableExists:
            tableName: campanha
        - not:
            - columnExists:
                tableName: campanha
                columnName: valor_arrecadado
      changes:
        - addColumn:
            tableName: campanha
            columns:
              - column:
                  name: valor_arrecadado
                  type: double
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: categoria
                  type: varchar(255)
              - column:
                  name: data_inicio
                  type: date
              - column:
                  name: data_fim
                  type: date
              - column:
                  name: encerrada
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: destaque
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

  # O Liquibase cria 'boolean' como TINYINT no MySQL, mas o Hibernate (validate)
  # espera BIT (como nas demais tabelas). Converte as duas colunas para BIT.
  - changeSet:
      id: bloco22-campanha-bool-para-bit
      author: connect-ong
      changes:
        - sql:
            sql: ALTER TABLE campanha MODIFY encerrada BIT NOT NULL DEFAULT b'0'
        - sql:
            sql: ALTER TABLE campanha MODIFY destaque BIT NOT NULL DEFAULT b'0'

  # =====================================================================
  # Bloco 23 - Timeline de Atividades: tabela do feed global de eventos
  # recentes da plataforma (reaproveita os hooks de notificacao).
  # data_criacao = datetime para casar com o mapeamento LocalDateTime do
  # Hibernate (mesmo tipo das demais tabelas; sem booleans = sem o gotcha
  # BIT/TINYINT do Bloco 22).
  # =====================================================================

  - changeSet:
      id: bloco23-atividade-create-table
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - tableExists:
                tableName: atividade
      changes:
        - createTable:
            tableName: atividade
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tipo
                  type: varchar(40)
              - column:
                  name: descricao
                  type: varchar(500)
              - column:
                  name: ong_id
                  type: bigint
              - column:
                  name: ong_nome
                  type: varchar(255)
              - column:
                  name: data_criacao
                  type: datetime

  - changeSet:
      id: bloco23-atividade-idx-data
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_atividade_data
      changes:
        - createIndex:
            indexName: idx_atividade_data
            tableName: atividade
            columns:
              - column:
                  name: data_criacao

  - changeSet:
      id: bloco23-atividade-idx-ong
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_atividade_ong
      changes:
        - createIndex:
            indexName: idx_atividade_ong
            tableName: atividade
            columns:
              - column:
                  name: ong_id

  # =====================================================================
  # Bloco 28 - Favoritos: doador marca ONG/campanha como favorita.
  # data_criacao = datetime (LocalDateTime); sem boolean = sem gotcha BIT.
  # =====================================================================

  - changeSet:
      id: bloco28-favorito-create-table
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - tableExists:
                tableName: favorito
      changes:
        - createTable:
            tableName: favorito
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: usuario_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: tipo
                  type: varchar(20)
              - column:
                  name: alvo_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: data_criacao
                  type: datetime

  - changeSet:
      id: bloco28-favorito-idx-usuario
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_favorito_usuario
      changes:
        - createIndex:
            indexName: idx_favorito_usuario
            tableName: favorito
            columns:
              - column:
                  name: usuario_id

  - changeSet:
      id: bloco28-favorito-idx-alvo
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_favorito_alvo
      changes:
        - createIndex:
            indexName: idx_favorito_alvo
            tableName: favorito
            columns:
              - column:
                  name: tipo
              - column:
                  name: alvo_id

  # =====================================================================
  # Bloco 29 - Denuncias: reportar ONG/usuario/conteudo (moderacao).
  # data_criacao = datetime; sem boolean = sem gotcha BIT.
  # =====================================================================

  - changeSet:
      id: bloco29-denuncia-create-table
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - tableExists:
                tableName: denuncia
      changes:
        - createTable:
            tableName: denuncia
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: denunciante_id
                  type: bigint
              - column:
                  name: tipo_alvo
                  type: varchar(20)
              - column:
                  name: alvo_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: motivo
                  type: varchar(60)
              - column:
                  name: descricao
                  type: varchar(1000)
              - column:
                  name: status
                  type: varchar(20)
              - column:
                  name: data_criacao
                  type: datetime

  - changeSet:
      id: bloco29-denuncia-idx-status
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_denuncia_status
      changes:
        - createIndex:
            indexName: idx_denuncia_status
            tableName: denuncia
            columns:
              - column:
                  name: status

  # =====================================================================
  # Bloco 21 (Fase 5) - dono da doacao de item.
  # A tabela 'doacao' era um catalogo global (sem dono), por isso "Minhas
  # Doacoes" no app aparecia igual para todos. Adiciona 'doador_id' (nullable:
  # linhas antigas ficam sem dono e somem de "minhas") para tornar a lista
  # por usuario. O GET /doacoes global continua para o desktop; o mobile passa
  # a usar GET /doacoes/minhas.
  # =====================================================================
  - changeSet:
      id: fase5-doacao-doador-id
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                tableName: doacao
                columnName: doador_id
      changes:
        - addColumn:
            tableName: doacao
            columns:
              - column:
                  name: doador_id
                  type: bigint

  # =====================================================================
  # Bloco 21 (Fase 5) - foto de perfil enviada da galeria (armazenada como
  # base64 num campo LONGTEXT, sem servidor de arquivos). fotoUrl continua
  # existindo como fallback.
  # =====================================================================
  - changeSet:
      id: fase5-usuario-foto-base64
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                tableName: usuario
                columnName: foto_base64
      changes:
        - addColumn:
            tableName: usuario
            columns:
              - column:
                  name: foto_base64
                  type: longtext

  # =====================================================================
  # Chat estilo WhatsApp - presenca e recibo de leitura.
  # data_leitura (mensagem) = "visto" (null = nao lida). ultimo_visto (usuario)
  # = presenca "online"/"visto por ultimo". Datetime (nao boolean) para evitar o
  # gotcha BIT/TINYINT com ddl-auto=validate no MySQL 5.6.
  # =====================================================================
  - changeSet:
      id: chat-mensagem-data-leitura
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                tableName: mensagem
                columnName: data_leitura
      changes:
        - addColumn:
            tableName: mensagem
            columns:
              - column:
                  name: data_leitura
                  type: datetime

  - changeSet:
      id: chat-usuario-ultimo-visto
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                tableName: usuario
                columnName: ultimo_visto
      changes:
        - addColumn:
            tableName: usuario
            columns:
              - column:
                  name: ultimo_visto
                  type: datetime

  # =====================================================================
  # Chat - reacoes (emoji) as mensagens. Guarda o CODIGO da reacao (LIKE, LOVE,
  # ...), nunca o emoji cru: o utf8 (3 bytes) do MySQL 5.6 quebraria com emoji
  # (4 bytes). Sem boolean = sem gotcha BIT. Unicidade (1 reacao por usuario por
  # mensagem) e garantida no codigo.
  # =====================================================================
  - changeSet:
      id: chat-reacao-create-table
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - tableExists:
                tableName: reacao
      changes:
        - createTable:
            tableName: reacao
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: mensagem_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: usuario_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: lado
                  type: varchar(10)
              - column:
                  name: emoji
                  type: varchar(20)
              - column:
                  name: data_criacao
                  type: datetime

  - changeSet:
      id: chat-reacao-idx-mensagem
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_reacao_mensagem
      changes:
        - createIndex:
            indexName: idx_reacao_mensagem
            tableName: reacao
            columns:
              - column:
                  name: mensagem_id

  # =====================================================================
  # Soft-delete: exclusao logica de contas (doador/ONG). data_exclusao NULL =
  # conta ativa; preenchida = "excluida" (some da UI e do login, mas o historico
  # - matches, doacoes, avaliacoes - fica intacto, sem orfaos nem erro de FK).
  # Datetime (nao boolean) evita o gotcha BIT/TINYINT com ddl-auto=validate.
  # =====================================================================
  - changeSet:
      id: softdelete-usuario-data-exclusao
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                tableName: usuario
                columnName: data_exclusao
      changes:
        - addColumn:
            tableName: usuario
            columns:
              - column:
                  name: data_exclusao
                  type: datetime

  - changeSet:
      id: softdelete-ong-data-exclusao
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                tableName: ong
                columnName: data_exclusao
      changes:
        - addColumn:
            tableName: ong
            columns:
              - column:
                  name: data_exclusao
                  type: datetime

  # =====================================================================
  # Esqueci a senha: codigos de recuperacao (POST /auth/esqueci-senha /
  # /auth/redefinir-senha). usado_em datetime null em vez de flag boolean
  # (padrao do projeto: o Liquibase criaria TINYINT e o Hibernate em modo
  # validate espera BIT no MySQL 5.6). codigo = varchar para preservar zeros
  # a esquerda; nunca contem emoji (utf8 3 bytes do MySQL 5.6 ok).
  # =====================================================================
  - changeSet:
      id: esqueci-senha-senha-reset-create-table
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - tableExists:
                tableName: senha_reset
      changes:
        - createTable:
            tableName: senha_reset
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: usuario_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: codigo
                  type: varchar(10)
              - column:
                  name: expira_em
                  type: datetime
              - column:
                  name: usado_em
                  type: datetime
              - column:
                  name: criado_em
                  type: datetime

  - changeSet:
      id: esqueci-senha-senha-reset-idx-usuario
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_senha_reset_usuario
      changes:
        - createIndex:
            indexName: idx_senha_reset_usuario
            tableName: senha_reset
            columns:
              - column:
                  name: usuario_id

  # =====================================================================
  # Contratos da feira (A-G) - 2026-07-03.
  # Padroes do projeto mantidos: sem boolean (datetime/int), datetime para
  # LocalDateTime, MEDIUMTEXT para fotos/anexos base64 (~16MB max, o DTO
  # limita a ~2.8MB), preConditions idempotentes (MARK_RAN).
  # =====================================================================

  # (A) PIX em 2 fases: doacao financeira pode nascer vinculada a uma campanha.
  - changeSet:
      id: feira-doacao-financeira-campanha-id
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                tableName: doacao_financeira
                columnName: campanha_id
      changes:
        - addColumn:
            tableName: doacao_financeira
            columns:
              - column:
                  name: campanha_id
                  type: bigint

  - changeSet:
      id: feira-idx-doacao-fin-campanha
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_doacao_fin_campanha
      changes:
        - createIndex:
            indexName: idx_doacao_fin_campanha
            tableName: doacao_financeira
            columns:
              - column:
                  name: campanha_id

  # (B) Match CONCLUIDO: momento em que a ONG marcou a doacao como recebida.
  - changeSet:
      id: feira-interesse-data-conclusao
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                tableName: interesse
                columnName: data_conclusao
      changes:
        - addColumn:
            tableName: interesse
            columns:
              - column:
                  name: data_conclusao
                  type: datetime

  # (C) Prestacao rica: fotos (base64) e valor utilizado.
  - changeSet:
      id: feira-prestacao-foto-create-table
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - tableExists:
                tableName: prestacao_foto
      changes:
        - createTable:
            tableName: prestacao_foto
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: prestacao_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: foto
                  type: mediumtext
              - column:
                  name: criado_em
                  type: datetime

  - changeSet:
      id: feira-idx-prestacao-foto-prestacao
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_prestacao_foto_prestacao
      changes:
        - createIndex:
            indexName: idx_prestacao_foto_prestacao
            tableName: prestacao_foto
            columns:
              - column:
                  name: prestacao_id

  - changeSet:
      id: feira-prestacao-valor-utilizado
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - columnExists:
                tableName: prestacao
                columnName: valor_utilizado
      changes:
        - addColumn:
            tableName: prestacao
            columns:
              - column:
                  name: valor_utilizado
                  type: double

  # (D) Avaliacao de doador (a ONG avalia o doador; upsert por ong+doador).
  - changeSet:
      id: feira-avaliacao-doador-create-table
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - tableExists:
                tableName: avaliacao_doador
      changes:
        - createTable:
            tableName: avaliacao_doador
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: doador_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: ong_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: nota
                  type: int
              - column:
                  name: comentario
                  type: varchar(500)
