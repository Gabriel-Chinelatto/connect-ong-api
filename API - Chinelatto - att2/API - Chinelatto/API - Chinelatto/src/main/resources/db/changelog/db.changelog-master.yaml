      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                tableName: doacao_financeira
                indexName: idx_doacao_fin_ong
      changes:
        - createIndex:
            tableName: doacao_financeira
            indexName: idx_doacao_fin_ong
            columns:
              - column:
                  name: ong_id

  - changeSet:
      id: bloco17-idx-avaliacao-ong
