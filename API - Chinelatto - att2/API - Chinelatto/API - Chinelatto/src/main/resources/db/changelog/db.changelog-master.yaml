  # =====================================================================
  # Verificacao em duas etapas (2FA) - 2026-07-07.
  # (1) Flag por conta na tabela preferencia (que predata o Liquibase, como
  #     usuario/ong): coluna dois_fatores INT (nao boolean -> sem gotcha
  #     BIT/TINYINT do ddl-auto=validate no MySQL 5.6). Linhas antigas ficam
  #     NULL = desligado; o codigo trata null e 0 como 2FA off.
  # (2) Tabela dois_fatores_codigo: codigos de 6 digitos (varchar, preserva
  #     zeros a esquerda), validade 10 min, usado_em datetime null = valido
  #     (padrao datetime-em-vez-de-flag). Espelha senha_reset.
  # =====================================================================
  - changeSet:
