  - changeSet:
      id: bloco17-idx-avaliacao-doador
      author: connect-ong
      preConditions:
        - onFail: MARK_RAN
        - onError: MARK_RAN
        - not:
            - indexExists:
                tableName: avaliacao
                indexName: idx_avaliacao_doador
      changes:
        - createIndex:
            tableName: avaliacao
            indexName: idx_avaliacao_doador
            columns:
