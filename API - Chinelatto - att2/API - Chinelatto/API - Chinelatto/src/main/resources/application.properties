spring.application.name=connectong-api

# ===== Migrations (Liquibase) =====
# A schema agora e versionada pelo Liquibase (ver db/changelog). O Hibernate
# NAO altera mais o banco: apenas valida que as entidades batem com a schema
# (validate). Usamos Liquibase (e nao Flyway) porque o Flyway Community deixou
# de suportar o MySQL 5.6 da escola (exige a edicao paga Teams).
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# ===== Banco de dados (MySQL) =====
# A SENHA nao fica mais aqui. Ela vem de uma variavel de ambiente (DB_PASSWORD)
# ou do arquivo local "application-local.properties" (que NAO vai para o Git).
# Para rodar localmente: copie "application-local.properties.example" para
# "application-local.properties" e preencha a senha real.
spring.datasource.url=${DB_URL:jdbc:mysql://143.106.241.3:3306/cl203161}
spring.datasource.username=${DB_USERNAME:cl203161}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true

# ===== Conta ADMIN (papel de moderacao, NAO auto-provisionavel) =====
# O AdminBootstrap cria a conta ADMIN no startup SE ambas estiverem preenchidas
# (e a conta ainda nao existir). Vazias por padrao => nenhum admin e criado
# (sem backdoor). Producao: defina APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD no
# ambiente (nunca versione a senha). Local: use application-local.properties.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# "Modo Feira" (/demo/seed): DESLIGADO por padrao (seguro). Com ele LIGADO, o
# esqueci-senha e o 2FA devolvem o codigo no JSON (simulacao de e-mail p/ a
# feira) — isso permitiria burlar reset/2FA de qualquer conta se ficasse ligado
# em producao. Por isso o default agora e false. Para LIGAR na maquina da feira,
# defina APP_DEMO_ENABLED=true no ambiente ou app.demo.enabled=true no
# application-local.properties (nao versionado). Mesmo criterio do app.security.enforce.
app.demo.enabled=${APP_DEMO_ENABLED:false}

# ===== Rate limiting (anti forca-bruta / anti-spam), ver RateLimitService =====
# 5 falhas de login consecutivas (mesma chave email+IP) => bloqueio de 15 min (429).
# Maximo ~5 solicitacoes/15min por IP no esqueci-senha e no cadastro publico.
app.ratelimit.max-falhas=${APP_RATELIMIT_MAX_FALHAS:5}
app.ratelimit.max-solicitacoes=${APP_RATELIMIT_MAX_SOLICITACOES:5}
app.ratelimit.janela-minutos=${APP_RATELIMIT_JANELA_MINUTOS:15}

# ===== Assistente de doacao com IA (Groq — tier GRATUITO) =====
# Chatbot que ajuda o doador (endpoint POST /assistente). Sem chave, funciona
# 100% no modo REGRAS (fallback local). Para ligar a IA, crie uma chave gratuita
# em https://console.groq.com/keys e configure de UMA das formas:
#   - variavel de ambiente:  APP_IA_GROQ_KEY=gsk_xxx
#   - application-local.properties (nao versionado): app.ia.groq.key=gsk_xxx
# NUNCA versione a chave. Ela nunca e logada.
app.ia.groq.key=${APP_IA_GROQ_KEY:}
app.ia.groq.modelo=${APP_IA_GROQ_MODELO:llama-3.1-8b-instant}
# Modelo de VISAO (multimodal): usado quando o doador envia uma FOTO do que quer
# doar (campo imagemBase64). Gratuito. O "scout" e o unico modelo de visao
# disponivel no free tier (verificado ao vivo com a chave real; o "maverick" da
# 404). Tem descontinuacao ANUNCIADA pela Groq — se um dia parar de responder,
# troque APP_IA_GROQ_MODELO_VISAO pelo modelo de visao vigente (a foto degrada
# graciosamente para o modo texto enquanto isso).
app.ia.groq.modelo-visao=${APP_IA_GROQ_MODELO_VISAO:meta-llama/llama-4-scout-17b-16e-instruct}
app.ia.groq.url=${APP_IA_GROQ_URL:https://api.groq.com/openai/v1/chat/completions}
app.ia.groq.temperatura=${APP_IA_GROQ_TEMPERATURA:0.4}
app.ia.groq.timeout-segundos=${APP_IA_GROQ_TIMEOUT:15}
# Teto de mensagens por IP na janela de rate limiting (protege a cota gratuita).
app.ia.ratelimit.max=${APP_IA_RATELIMIT_MAX:30}

# Carrega as credenciais locais, se o arquivo existir (sem versionar)
spring.config.import=optional:classpath:application-local.properties