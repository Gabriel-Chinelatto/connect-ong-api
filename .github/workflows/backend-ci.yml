name: Backend CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    # O projeto Maven fica numa subpasta (com espacos) dentro do repo.
    defaults:
      run:
        working-directory: "API - Chinelatto - att2/API - Chinelatto/API - Chinelatto"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Permissao de execucao do mvnw
        run: chmod +x mvnw

      - name: Build e testes (mvn verify)
        run: ./mvnw -B verify
